# Static checks only: no cluster, no Azure credentials. Each job runs the same Makefile
# target you can run locally (make ci).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - run: make ci-terraform

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - run: make ci-helm

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled on GitHub's Ubuntu runners
      - run: make ci-shell
