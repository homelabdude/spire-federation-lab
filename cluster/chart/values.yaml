# Defaults for the spire-lab chart. Environment-specific values (trust domain,
# issuer hostname, IPs, federation peer) go in cluster/values.local.yaml, which is
# gitignored. See cluster/values.local.example.yaml.

# Public hostname of the OIDC discovery provider (the JWT issuer is https://<oidcHost>).
# Used by the Gateway listener. The chart checks that the spire.* issuer settings match it.
oidcHost: ""

# --- Upstream spiffe/spire ---------------------------------------------------

global:
  spire:
    # Set in values.local.yaml: trustDomain, clusterName, jwtIssuer (https://<oidcHost>)
    trustDomain: ""
    clusterName: ""
    jwtIssuer: ""
    # Enables PSS-labelled namespaces (spire-server / spire-system), priority
    # classes, restricted security contexts, prometheus endpoints, and strict
    # mode, which refuses to render while example.org defaults are still set.
    recommendations:
      enabled: true
    namespaces:
      create: true
    caSubject:
      country: ZZ
      organization: spire-federation-lab
      commonName: spire-federation-lab
    persistence:
      storageClass: longhorn

spire:
  spire-server:
    # jwt_key_type falls back to ca_key_type, and the chart has no separate
    # jwtKeyType, so this also makes JWT-SVIDs RS256. Entra ID only accepts
    # RSA-signed assertions from external issuers.
    caKeyType: rsa-2048
    caTTL: 24h
    defaultX509SvidTTL: 1h
    # Only used as a client assertion for Entra token exchange, so keep it short.
    defaultJwtSvidTTL: 15m

    # Serves the https_spiffe bundle endpoint on :8443. It's exposed on the LAN by
    # this chart's bundle-endpoint Service, so the server API on :8081 stays ClusterIP.
    federation:
      enabled: true
      bundleEndpoint:
        refreshHint: 5m

    controllerManager:
      # Must match federation.className below. The controller ignores
      # ClusterSPIFFEIDs / ClusterFederatedTrustDomains with any other class.
      className: spire-lab

    # x509pop for agents outside the cluster (the VM): the agent proves it holds the key
    # of a node cert issued by our enrollment CA. The Makefile passes that CA with
    # --set-file from out/x509pop-ca.pem. k8s_psat stays on for the in-cluster agents.
    nodeAttestor:
      x509POP:
        enabled: false
        mode: externalPKI

    # Tornjak backend, a sidecar in the server pod with full admin access to the
    # server API and no authentication of its own. It stays ClusterIP and is
    # reached with `make tornjak` (kubectl port-forward), so Kubernetes RBAC on
    # spire-server decides who can use it.
    tornjak:
      enabled: true

  spire-agent:
    workloadAttestors:
      k8s:
        verification:
          # kubeadm kubelets have a self-signed serving cert in /var/lib/kubelet/pki.
          # auto tries that first and then falls back to the API server CA.
          # The chart default is skip.
          type: auto

  spiffe-oidc-discovery-provider:
    # TLS is terminated by the public reverse proxy in front of Envoy Gateway :80,
    # so serve plain HTTP and let the chart render an HTTPRoute on the existing Gateway.
    tls:
      spire:
        enabled: false
    config:
      # Set in values.local.yaml to https://<oidcHost>/keys. Behind a
      # TLS-terminating proxy the provider would otherwise advertise http://.
      jwksUri: ""
      setKeyUse: true
    gatewayAPI:
      enabled: true
      # Set in values.local.yaml to <oidcHost>.
      host: ""
      listenerSet:
        enabled: false
      # The chart uses parentRefs verbatim, so sectionName goes here. spire-oidc is
      # the listener rendered from templates/gateway-listener.yaml.
      parentRefs:
        - name: eg
          namespace: envoy-gateway-system
          sectionName: spire-oidc

  tornjak-frontend:
    enabled: true
    # The UI is a browser app that calls the backend from the browser, so this is
    # the backend as seen from your machine: http://localhost:10000 through
    # `make tornjak`, or https://<tornjakRoute.host> with the route.
    apiServerURL: http://localhost:10000

# --- This chart ----------------------------------------------------------------

gateway:
  name: eg
  namespace: envoy-gateway-system
  listenerName: spire-oidc
  # Only used by `make cluster-listener` to render the listener, which it then adds
  # to the live Gateway with a JSON patch. The Gateway belongs to another repo, so
  # it's never part of this release.
  renderListener: false

bundleEndpoint:
  # MetalLB IP for the SPIFFE bundle endpoint (https_spiffe, TCP 8443).
  loadBalancerIP: ""

# Server API (TCP 8081) on the LAN, for spire-agents outside the cluster (the VM).
# Agents verify the server by its SPIFFE ID against their bootstrap bundle, so the
# IP needs no certificate.
serverEndpoint:
  enabled: false
  loadBalancerIP: ""
  # Required when enabled. Enforced by kube-proxy (or the CNI's replacement), not by
  # MetalLB, so only these sources reach :8081 on the LB IP.
  allowedSourceRanges: []

# Node aliases for x509pop agents, by node cert CN. In externalPKI mode the upstream chart
# doesn't render agentPathTemplate, so an x509pop agent's ID ends in its cert fingerprint
# and changes on every renewal. Each alias gives the agent whose cert has that CN a stable
# ID, spiffe://<trustDomain>/node/<cn>, to use as the parentID of its workload entries.
# Only certs from the enrollment CA are accepted, so the CN can't be claimed by anyone else.
nodeAliases: []
#  - vm-1

# Tornjak UI on the existing eg Gateway, behind an Entra ID login run by Envoy Gateway
# (SecurityPolicy). One hostname: /api/ goes to the backend, the rest to the UI, so the
# login cookie covers both. The Entra app comes from azure/terraform (enable_tornjak_oidc).
tornjakRoute:
  enabled: false
  # Must be covered by the listener below, e.g. tornjak.k8s.<domain>
  host: ""
  # Existing listener on eg that accepts routes from all namespaces. The route only
  # attaches to it, the Gateway itself isn't changed.
  sectionName: http
  oidc:
    tenantID: ""
    clientID: ""
    # Created by `make tornjak-oidc-secret` (key client-secret), not by this chart
    clientSecretName: tornjak-oidc
    # App role required in the ID token's roles claim
    requiredRole: Tornjak.Admin

# Federation with trust domain B (the VM). Enable once its SPIRE server is running.
federation:
  enabled: false
  name: vm
  className: spire-lab
  trustDomain: ""
  bundleEndpointURL: ""
  # Defaults to spiffe://<trustDomain>/spire/server
  endpointSPIFFEID: ""
  # Bootstrap bundle for the https_spiffe endpoint (spire-server bundle show -format spiffe
  # on the VM). The Makefile passes it with --set-file from out/vm.bundle.json.
  trustDomainBundle: ""
  # Pods matching this also get trust domain B's bundle. Others only trust their own
  # domain, via the upstream chart's fallback ClusterSPIFFEID.
  podSelector:
    matchLabels:
      spire-lab/federates-with: vm
