# Copy to inventory.ini (gitignored) and fill in.
# The host name is the node certificate CN and must be listed in the chart's nodeAliases.

[spire_agents]
vm-1 ansible_host=192.168.0.220

[spire_agents:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
# global.spire.trustDomain in cluster/values.local.yaml
spire_trust_domain=k8s.spire-lab.internal
# serverEndpoint.loadBalancerIP in cluster/values.local.yaml
spire_server_address=192.168.0.242
